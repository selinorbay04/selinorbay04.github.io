  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap"></noscript>

  <style>
    :root {
      --burnt:   #8B3800;
      --cream-dark:   #FFF3DF;
      --orange:  #F97316;
      --bg:      #FFF3DF;
      --font-graffiti: 'Bangers', cursive;
      --page-bg: var(--bg);

      --nav-h:            68px;
      --nav-pad-x:        clamp(24px, 4vw, 56px);
      --nav-gap:          32px;
      --nav-logo-size:    28px;
      --nav-fg:           var(--black);
      --nav-bg-scrolled:  var(--bg);

      --footer-line: rgba(15,15,15,0.08);
      --footer-fg:   rgba(15,15,15,0.35);
    }


    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      padding: calc(var(--nav-h) + 68px) clamp(24px, 6vw, 80px) 0;
      display: flex;
      align-items: flex-end;
      gap: clamp(16px, 3vw, 40px);
      flex-wrap: wrap;
      position: relative;
    }

    .hero-title {
      font-family: var(--font-graffiti);
      font-size: clamp(64px, 12vw, 160px);
      letter-spacing: 7px;
      line-height: 0.88;
      color: var(--burnt);
      -webkit-text-stroke: 2.5px rgba(15,15,15,0.7);
      text-shadow:
        3px 3px 0 rgba(15,15,15,0.25),
        -1px -1px 0 rgba(139,56,0,.4);
    }

    .hero-meta {
      padding-bottom: clamp(10px, 1.5vw, 18px);
    }
    .hero-meta p {
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(15,15,15,0.5);
      max-width: 300px;
    }
    .hero-count {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      color: var(--burnt);
      letter-spacing: 2px;
      display: block;
      margin-bottom: 4px;
    }

    .hero-rule {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--burnt) 0%, rgba(139,56,0,.1) 60%, transparent 100%);
      margin: clamp(20px, 3vh, 36px) 0 0;
    }


    .sk-back {
      position: absolute;
      top: calc(var(--nav-h) + 14px);
      left: clamp(24px, 6vw, 80px);
      color: var(--black);
    }


    /* ══════════════════════════════════════
       FILTER PILLS  (sticky under the nav; need JS, so hidden without it)
    ══════════════════════════════════════ */
    .filters {
      position: sticky;
      top: var(--nav-h);
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px clamp(24px, 6vw, 80px);
      background: color-mix(in srgb, var(--cream) 92%, transparent);
      backdrop-filter: blur(8px);
      color: var(--black);
    }
    html:not(.js) .filters { display: none; }


    /* ══════════════════════════════════════
       THE DESK
       Sketches lie scattered: each has a seeded rotation (±4°) and a
       small offset baked into its inline style, so the layout is the
       same every visit and without JS. Hover lifts and straightens.
    ══════════════════════════════════════ */
    .desk {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: clamp(36px, 4vw, 56px) clamp(28px, 3vw, 44px);
      align-items: center;
      padding: clamp(32px, 5vh, 56px) clamp(24px, 6vw, 80px) clamp(64px, 10vh, 120px);
      max-width: 1600px;
      margin: 0 auto;
    }
    .sk[hidden] { display: none; }
    .sk { position: relative; }
    .sk-paper {
      display: block;
      transform: translate(var(--dx), var(--dy)) rotate(var(--r));
      box-shadow: 0 1px 2px rgba(61,16,0,0.12), 0 10px 22px -12px rgba(61,16,0,0.35);
      transition: transform 0.5s var(--ease-out), box-shadow 0.5s var(--ease-out);
      background: var(--cream);
    }
    .sk-paper img { display: block; width: 100%; height: auto; }
    .sk:hover { z-index: 5; }
    .sk-paper:hover,
    .sk-paper:focus-visible {
      transform: translate(var(--dx), calc(var(--dy) - 10px)) rotate(0deg) scale(1.05);
      box-shadow: 0 2px 4px rgba(61,16,0,0.12), 0 28px 48px -18px rgba(61,16,0,0.5);
    }

    /* Mobile: two staggered columns, no scatter */
    @media (max-width: 767px) {
      .desk { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; align-items: start; padding-inline: 16px; }
      .sk-paper, .sk-paper:hover, .sk-paper:focus-visible { transform: none; }
      .sk:nth-child(even) { margin-top: 28px; }
      .filters { padding: 10px 16px; gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sk-paper { transition: none; }
    }

  </style>
</head>
