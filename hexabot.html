<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpiderPi Hexabot — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:      #F5E3C8;
      --text:    #1A1A1A;
      --line:    rgba(26,26,26,0.12);
      --nav-h:   68px;
      --pad-x:   clamp(24px, 6vw, 80px);
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 var(--pad-x);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    nav.scrolled {
      background: var(--bg);
      box-shadow: 0 1px 0 var(--line);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
      transition: color 0.4s ease;
    }
    nav.scrolled .logo { color: var(--text); }

    .nav-links { display: flex; gap: 32px; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
      text-decoration: none;
      transition: color 0.4s ease, opacity 0.2s ease;
    }
    nav.scrolled .nav-links a { color: var(--text); }
    .nav-links a:hover { opacity: 0.55; }


    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      position: relative;
      height: 60vh;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: calc(var(--nav-h) + 24px) var(--pad-x) 40px;
      overflow: hidden;
      background: #111;
    }

    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 35%;
      opacity: 0.6;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
    }

    .hero-content { position: relative; z-index: 1; }

    .hero-kicker {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(245,227,200,0.6);
      margin-bottom: 10px;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(60px, 11vw, 136px);
      letter-spacing: 3px;
      line-height: 0.92;
      color: #F5E3C8;
    }


    /* ══════════════════════════════════════
       CLICK TO SEE + PROJECT CARDS
    ══════════════════════════════════════ */
    .cta-label {
      text-align: center;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text);
      padding: clamp(32px, 5vh, 56px) var(--pad-x) 16px;
    }

    .project-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 0 3px 3px;
    }

    .proj-card {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      display: block;
      text-decoration: none;
      background: #1a1a1a;
      cursor: pointer;
    }

    .proj-card img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease;
    }

    .proj-card:hover img {
      transform: scale(1.04);
    }

    /* Warm dark gradient overlay */
    .proj-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 30%,
        rgba(40, 15, 0, 0.82) 100%
      );
    }

    .proj-card-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 1;
      padding: clamp(14px, 2.5vw, 28px);
    }

    .proj-card-label span {
      font-family: var(--font-display);
      font-size: clamp(22px, 4vw, 48px);
      letter-spacing: 2px;
      line-height: 1;
      color: #F5E3C8;
      display: block;
    }


    /* ══════════════════════════════════════
       FOOTER
    ══════════════════════════════════════ */
    footer {
      border-top: 1px solid var(--line);
      padding: 24px var(--pad-x);
      background: var(--bg);
    }

    footer span {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      color: rgba(26,26,26,0.4);
      letter-spacing: 0.5px;
    }

  </style>
</head>
<body>


<!-- ════════════════════════
     NAV
════════════════════════ -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>


<!-- ════════════════════════
     HERO
     assets/images/hexabot/hero.jpg
════════════════════════ -->
<section class="hero">
  <img class="hero-photo" src="assests/images/projects/hexabot.png" alt="SpiderPi Hexabot">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-kicker">Robotics · CS/ME 301 · Northwestern</p>
    <h1 class="hero-title">SPIDERPI HEXABOT</h1>
  </div>
</section>


<!-- ════════════════════════
     PROJECT SELECTION
════════════════════════ -->
<p class="cta-label">Click to see...</p>

<div class="project-cards">

  <!-- Gait Correction -->
  <a class="proj-card" href="gait-correction.html">
    <!-- assets/images/hexabot/gait-thumb.jpg — top-down robot photo -->
    <img src="assests/images/projects/hexabot/gait-hero.png" alt="Gait Correction with Q-Learning">
    <div class="proj-card-label">
      <span>GAIT CORRECTION WITH Q-LEARNING</span>
    </div>
  </a>

  <!-- Mapping -->
  <a class="proj-card" href="mapping.html">
    <!-- assets/images/hexabot/mapping-thumb.jpg — robot in corridor -->
    <img src="assests/images/projects/hexabot/mapping-hero.png" alt="Mapping an Unknown Maze">
    <div class="proj-card-label">
      <span>MAPPING AN UNKNOWN MAZE</span>
    </div>
  </a>

</div>


<!-- ════════════════════════
     FOOTER
════════════════════════ -->
<footer>
  <span>Selin Orbay</span>
</footer>


<!-- ════════════════════════
     JAVASCRIPT
════════════════════════ -->
<script>
  const nav  = document.getElementById('nav');
  const hero = document.querySelector('.hero');
  function updateNav() {
    nav.classList.toggle('scrolled', window.scrollY > hero.offsetHeight - 80);
  }
  window.addEventListener('scroll', updateNav, { passive: true });
  updateNav();
</script>

</body>
</html>
