<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" data-fonts onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap"></noscript>

  <link rel="stylesheet" href="css/base.css">
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.SO)document.documentElement.classList.add('motion-off')},3000)</script>

  <style>
    :root {
      --burnt:        #8B3800;
      --bg:           #0f0f0f;
      --font-graffiti:'Bangers', cursive;
      --page-bg:      var(--bg);
      --page-fg:      var(--cream);

      --nav-h:             68px;
      --nav-pad-x:         clamp(24px, 4vw, 56px);
      --nav-gap:           32px;
      --nav-logo-size:     28px;
      --nav-fg:            var(--cream);
      --nav-fg-scrolled:   var(--cream);
      --nav-bg-scrolled:   var(--bg);
      --nav-line-scrolled: rgba(0,0,0,0.5);

      --footer-line: rgba(255,243,223,0.07);
      --footer-fg:   rgba(255,243,223,0.3);
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */


    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,243,223,0.45);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--orange-burnt); }
    .back-link svg { width: 14px; height: 14px; }


    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      padding: calc(var(--nav-h) + 68px) clamp(24px, 6vw, 80px) 0;
      display: flex;
      align-items: flex-end;
      gap: clamp(16px, 3vw, 40px);
      flex-wrap: wrap;
      position: relative;
    }

    .hero-title {
      font-family: var(--font-graffiti);
      font-size: clamp(80px, 16vw, 200px);
      letter-spacing: 8px;
      line-height: 0.88;
      color: var(--brown);
      -webkit-text-stroke: 3px rgba(139,56,0,.5);
      text-shadow:
        5px 5px 0 rgba(0,0,0,.5),
        -2px -2px 0 #3d1000,
        0 0 70px rgba(139,56,0,.3);
    }

    .hero-meta {
      padding-bottom: clamp(10px, 1.5vw, 18px);
    }
    .hero-meta p {
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255,243,223,0.45);
      max-width: 300px;
    }
    .hero-count {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      color: var(--orange-burnt);
      letter-spacing: 2px;
      display: block;
      margin-bottom: 4px;
    }

    .hero-rule {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--brown) 0%, rgba(90,18,0,.1) 60%, transparent 100%);
      margin: clamp(20px, 3vh, 36px) 0 0;
    }


    /* ══════════════════════════════════════
       MODELS GRID
       Same visual logic as projects.html:
       image + always-on bottom gradient,
       dark overlay fades in on hover.
    ══════════════════════════════════════ */
    .section-label {
      padding: clamp(32px, 5vh, 56px) clamp(24px, 6vw, 80px) clamp(12px, 1.5vh, 18px);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,243,223,0.3);
    }

    /* Three renders side by side on cream plinths. The renders have
       white backgrounds; multiply turns that white into the cream, and
       contain means nothing is ever cropped. */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 1.6vw, 24px);
      padding: 0 clamp(24px, 6vw, 80px) clamp(56px, 9vh, 104px);
    }
    .model-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--cream);
    }
    .model-plinth {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 10px;
      background: var(--cream);
    }
    .model-plinth img {
      position: absolute;
      inset: 9%;
      width: 82%; height: 82%;
      object-fit: contain;
      mix-blend-mode: multiply;
      will-change: transform;
    }
    .model-label {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      gap: 14px;
      padding: 14px 2px 0;
      border-top: 1px solid rgba(255,243,223,0.18);
      margin-top: 14px;
    }
    .model-num  { font-size: 12px; font-weight: 500; letter-spacing: 2px; opacity: 0.55; }
    .model-name { font-family: var(--font-display); font-size: clamp(26px, 2.6vw, 40px); letter-spacing: 2px; line-height: 1; }
    .model-tool { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; }
    @media (hover: hover) and (pointer: fine) {
      .model-card:hover .model-name { color: var(--orange); }
    }
    @media (max-width: 767px) {
      .models-grid { grid-template-columns: 1fr; padding-inline: 16px; }
    }

    .pg-back { position: absolute; top: calc(var(--nav-h) + 14px); left: clamp(24px, 6vw, 80px); color: var(--cream); }
    .hero { position: relative; }

  </style>
</head>
<body>


<!-- ════════════════════════
     NAV
════════════════════════ -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>


<!-- ════════════════════════
     HERO
════════════════════════ -->
<header class="hero">

  <a class="pill pg-back" href="playground.html">← Playground</a>

  <h1 class="hero-title">CAD</h1>

  <div class="hero-meta">
    <span class="hero-count">3</span>
    <p>3D models built in SolidWorks — from functional parts to design exercises.</p>
  </div>

  <div class="hero-rule"></div>
</header>


<!-- ════════════════════════
     MODELS
════════════════════════ -->
<p class="section-label">Models</p>

<section class="models-grid" data-reveal-batch>
  <a class="model-card" href="assests/playground/images_to_display/web/CT_.jpg" data-lightbox="cad" data-label="CAD · Ct Scanner">
    <div class="model-plinth" data-hover-parallax><img src="assests/playground/images_to_display/web/CT_.jpg" width="1578" height="1316" alt="CT scanner gantry, modelled in SolidWorks" loading="lazy" decoding="async"></div>
    <div class="model-label">
      <span class="model-num">[01]</span>
      <span class="model-name">CT SCANNER</span>
      <span class="model-tool">SolidWorks</span>
    </div>
  </a>
  <a class="model-card" href="assests/playground/images_to_display/web/Dode_.jpg" data-lightbox="cad" data-label="CAD · Dodecahedron">
    <div class="model-plinth" data-hover-parallax><img src="assests/playground/images_to_display/web/Dode_.jpg" width="1220" height="1178" alt="Twisted-panel dodecahedron, modelled in SolidWorks" loading="lazy" decoding="async"></div>
    <div class="model-label">
      <span class="model-num">[02]</span>
      <span class="model-name">DODECAHEDRON</span>
      <span class="model-tool">SolidWorks</span>
    </div>
  </a>
  <a class="model-card" href="assests/playground/images_to_display/web/Vase_.jpg" data-lightbox="cad" data-label="CAD · Vase">
    <div class="model-plinth" data-hover-parallax><img src="assests/playground/images_to_display/web/Vase_.jpg" width="704" height="1208" alt="Wavy vase, modelled in SolidWorks" loading="lazy" decoding="async"></div>
    <div class="model-label">
      <span class="model-num">[03]</span>
      <span class="model-name">VASE</span>
      <span class="model-tool">SolidWorks</span>
    </div>
  </a>
</section>


<!-- ════════════════════════
     FOOTER
════════════════════════ -->
<footer class="footer--split">
  <span>Selin Orbay</span>
  <span>
    <a href="playground.html" style="color:rgba(255,243,223,.3);text-decoration:none;font-size:12px;font-weight:300;">← Back to Playground</a>
  </span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js" defer></script>

</body>
</html>
