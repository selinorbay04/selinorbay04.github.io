<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.SO)document.documentElement.classList.add('motion-off')},3000)</script>

  <style>
    :root {
      --burnt:        #8B3800;
      --green:        #344524;
      --green-light:  #5C7040;
      --bg:           #0D1308;
      --font-graffiti:'Bangers', cursive;
      --page-bg:      var(--bg);
      --page-fg:      var(--cream);

      --nav-h:             68px;
      --nav-pad-x:         clamp(24px, 4vw, 56px);
      --nav-gap:           32px;
      --nav-logo-size:     28px;
      --nav-fg:            var(--cream);
      --nav-fg-scrolled:   var(--cream);
      --nav-bg-scrolled:   var(--bg);
      --nav-line-scrolled: rgba(0,0,0,0.5);

      --footer-line: rgba(255,243,223,0.07);
      --footer-fg:   rgba(255,243,223,0.3);
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */


    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,243,223,0.45);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--green-light); }
    .back-link svg { width: 14px; height: 14px; }


    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      padding: calc(var(--nav-h) + 40px) clamp(24px, 6vw, 80px) 0;
      display: flex;
      align-items: flex-end;
      gap: clamp(16px, 3vw, 40px);
      flex-wrap: wrap;
      position: relative;
    }

    .hero-title {
      font-family: var(--font-graffiti);
      font-size: clamp(80px, 16vw, 200px);
      letter-spacing: 8px;
      line-height: 0.88;
      color: var(--green);
      -webkit-text-stroke: 3px rgba(92,112,64,.5);
      text-shadow:
        5px 5px 0 rgba(0,0,0,.5),
        -2px -2px 0 #1a2510,
        0 0 70px rgba(92,112,64,.3);
    }

    .hero-meta {
      padding-bottom: clamp(10px, 1.5vw, 18px);
    }
    .hero-meta p {
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255,243,223,0.45);
      max-width: 300px;
    }
    .hero-count {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      color: var(--green-light);
      letter-spacing: 2px;
      display: block;
      margin-bottom: 4px;
    }

    .hero-rule {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--green) 0%, rgba(52,69,36,.1) 60%, transparent 100%);
      margin: clamp(20px, 3vh, 36px) 0 0;
    }


    /* ══════════════════════════════════════
       MODELS GRID
       Same visual logic as projects.html:
       image + always-on bottom gradient,
       dark overlay fades in on hover.
    ══════════════════════════════════════ */
    .section-label {
      padding: clamp(32px, 5vh, 56px) clamp(24px, 6vw, 80px) clamp(12px, 1.5vh, 18px);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,243,223,0.3);
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 0 3px 3px;
    }

    /* 3rd card full width */
    .model-card:nth-child(3) {
      grid-column: 1 / -1;
    }

    .model-card {
      position: relative;
      display: block;
      overflow: hidden;
      text-decoration: none;
      aspect-ratio: 16 / 9;
      background: #111;
      cursor: pointer;
    }

    .model-card img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease;
    }
    .model-card:hover img { transform: scale(1.05); }

    /* hover darkening overlay */
    .model-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      opacity: 0;
      z-index: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .model-card:hover::before { opacity: 1; }

    /* bottom gradient — always on */
    .model-card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        transparent 30%,
        rgba(0,0,0,0.85) 100%
      );
    }

    .model-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 3;
      padding: clamp(16px, 2.5vw, 28px);
    }

    .model-num {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255,255,255,.4);
      display: block;
      margin-bottom: 5px;
    }
    .model-name {
      font-family: var(--font-display);
      font-size: clamp(22px, 3.5vw, 48px);
      letter-spacing: 2px;
      color: #fff;
      display: block;
      margin-bottom: 5px;
      transition: letter-spacing .25s ease;
    }
    .model-card:hover .model-name { letter-spacing: 4px; }

    .model-tool {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green-light);
      display: block;
    }

    /* green accent line slides in on hover */
    .model-card .accent-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: var(--green);
      z-index: 4;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .45s cubic-bezier(.16,1,.3,1);
    }
    .model-card:hover .accent-bar { transform: scaleX(1); }


  </style>
</head>
<body>


<!-- ════════════════════════
     NAV
════════════════════════ -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>


<!-- ════════════════════════
     HERO
════════════════════════ -->
<header class="hero">

  <a class="back-link" href="playground.html"
     style="position:absolute;top:calc(var(--nav-h)+14px);left:clamp(24px,6vw,80px);">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 4l-5 4 5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Playground
  </a>

  <h1 class="hero-title">CAD</h1>

  <div class="hero-meta">
    <span class="hero-count">3</span>
    <p>3D models built in SolidWorks — from functional parts to design exercises.</p>
  </div>

  <div class="hero-rule"></div>
</header>


<!-- ════════════════════════
     MODELS
════════════════════════ -->
<p class="section-label">Models</p>

<section class="models-grid">

  <!-- Model 01 -->
  <a class="model-card" href="cad.html">
    <div class="accent-bar"></div>
    <img src="assests/playground/images_to_display/CT_.png" alt="CT Scanner CAD Model" loading="lazy">
    <div class="model-label">
      <span class="model-num">01</span>
      <span class="model-name">CT SCANNER</span>
      <span class="model-tool">SolidWorks</span>
    </div>
  </a>

  <!-- Model 02 -->
  <a class="model-card" href="cad.html">
    <div class="accent-bar"></div>
    <img src="assests/playground/images_to_display/Dode_.png" alt="Dodecahedron CAD Model" loading="lazy">
    <div class="model-label">
      <span class="model-num">02</span>
      <span class="model-name">DODECAHEDRON</span>
      <span class="model-tool">SolidWorks</span>
    </div>
  </a>

  <!-- Model 03 — full width -->
  <a class="model-card" href="cad.html">
    <div class="accent-bar"></div>
    <img src="assests/playground/images_to_display/Vase_.png" alt="Vase CAD Model" loading="lazy">
    <div class="model-label">
      <span class="model-num">03</span>
      <span class="model-name">VASE</span>
      <span class="model-tool">SolidWorks</span>
    </div>
  </a>

</section>


<!-- ════════════════════════
     FOOTER
════════════════════════ -->
<footer class="footer--split">
  <span>Selin Orbay</span>
  <span>
    <a href="playground.html" style="color:rgba(255,243,223,.3);text-decoration:none;font-size:12px;font-weight:300;">← Back to Playground</a>
  </span>
</footer>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
<script src="js/motion.js" defer></script>

</body>
</html>
