<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint Sketches — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:   #F5E3C8;
      --burnt:   #8B3800;
      --black:   #0f0f0f;
      --bg:      #F5E3C8;
      --nav-h:   68px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-graffiti: 'Bangers', cursive;
      --font-body:     'Inter', sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--black); overflow-x: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    nav.scrolled { background: var(--bg); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
    .logo { font-family: var(--font-display); font-size: 28px; letter-spacing: 2px; color: var(--black); text-decoration: none; }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { font-size: 14px; font-weight: 600; letter-spacing: 0.6px; color: var(--black); text-decoration: none; transition: opacity .2s; }
    .nav-links a:hover { opacity: .5; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(15,15,15,0.4); text-decoration: none; transition: color .2s;
    }
    .back-link:hover { color: var(--burnt); }
    .back-link svg { width: 14px; height: 14px; }

    .hero {
      padding: calc(var(--nav-h) + 40px) clamp(24px, 6vw, 80px) 0;
      display: flex; align-items: flex-end; gap: clamp(16px, 3vw, 40px);
      flex-wrap: wrap; position: relative;
    }
    .hero-title {
      font-family: var(--font-graffiti);
      font-size: clamp(48px, 9vw, 130px);
      letter-spacing: 7px; line-height: 0.88;
      color: var(--burnt);
      -webkit-text-stroke: 2.5px rgba(15,15,15,0.7);
      text-shadow: 3px 3px 0 rgba(15,15,15,0.25), -1px -1px 0 rgba(139,56,0,.4);
    }
    .hero-meta { padding-bottom: clamp(10px, 1.5vw, 18px); }
    .hero-meta p { font-size: clamp(13px, 1.2vw, 15px); font-weight: 300; line-height: 1.7; color: rgba(15,15,15,0.5); max-width: 300px; }
    .hero-count { font-family: var(--font-display); font-size: clamp(36px, 5vw, 64px); color: var(--burnt); letter-spacing: 2px; display: block; margin-bottom: 4px; }
    .hero-rule { width: 100%; height: 2px; background: linear-gradient(90deg, var(--burnt) 0%, rgba(139,56,0,.1) 60%, transparent 100%); margin: clamp(20px, 3vh, 36px) 0 0; }

    .gallery {
      padding: clamp(24px, 4vh, 48px) clamp(16px, 3vw, 40px) clamp(48px, 8vh, 96px);
      columns: 2; column-gap: clamp(10px, 1.5vw, 20px);
    }
    @media (min-width: 900px)  { .gallery { columns: 3; } }
    @media (min-width: 1300px) { .gallery { columns: 4; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: clamp(10px, 1.5vw, 20px);
      display: block; position: relative;
      border-radius: 12px; overflow: hidden; cursor: pointer; text-decoration: none;
      border: 2px solid rgba(139,56,0,.18);
      transition: border-color .3s ease, transform .35s ease, box-shadow .3s ease;
    }
    .gallery-item:hover {
      border-color: var(--burnt);
      transform: translateY(-4px) rotate(0.4deg);
      box-shadow: 0 16px 48px rgba(139,56,0,.18), 0 6px 16px rgba(0,0,0,.12);
    }

    .gallery-item img {
      display: block; width: 100%; height: auto;
      transition: transform .5s ease;
    }
    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-item::after {
      content: attr(data-num);
      position: absolute; top: 10px; right: 10px; z-index: 2;
      font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: rgba(255,255,255,0.9); background: rgba(139,56,0,.75);
      padding: 2px 7px; border-radius: 20px;
      opacity: 0; transition: opacity .25s ease;
    }
    .gallery-item:hover::after { opacity: 1; }

    footer {
      border-top: 1px solid rgba(15,15,15,0.08);
      padding: 24px clamp(24px, 6vw, 80px);
      background: var(--bg);
      display: flex; justify-content: space-between; align-items: center;
    }
    footer span { font-size: 12px; font-weight: 300; color: rgba(15,15,15,.35); letter-spacing: .5px; }

    /* ── Lightbox ─────────────────────────── */
    #lightbox {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
    }
    #lightbox.open { opacity: 1; pointer-events: all; }
    #lb-backdrop {
      position: absolute; inset: 0;
      background: rgba(10,8,6,0.92);
      cursor: zoom-out;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #lb-frame {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      transform: scale(0.82);
      transition: transform .42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #lightbox.open #lb-frame { transform: scale(1); }
    #lb-img {
      display: block;
      max-width: 90vw; max-height: 90vh;
      width: auto; height: auto;
      border-radius: 6px;
      box-shadow: 0 32px 96px rgba(0,0,0,.7), 0 8px 24px rgba(0,0,0,.4);
      transition: opacity .18s ease;
    }
    #lb-close {
      position: absolute; top: -44px; right: 0;
      background: none; border: none; cursor: pointer;
      color: rgba(245,227,200,.7); font-size: 20px;
      font-family: var(--font-body); line-height: 1; padding: 6px 10px;
      transition: color .2s, transform .2s;
    }
    #lb-close:hover { color: var(--burnt); transform: scale(1.25); }
    #lb-counter {
      position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%);
      font-family: var(--font-body); font-size: 11px; font-weight: 600;
      letter-spacing: 2px; color: rgba(245,227,200,.4); white-space: nowrap;
    }
    .lb-arrow {
      position: fixed; top: 50%; z-index: 2;
      background: none; border: none; cursor: pointer;
      color: rgba(245,227,200,.55); padding: 16px;
      transform: translateY(-50%);
      transition: color .2s, transform .25s;
    }
    #lb-prev { left: clamp(10px,2vw,32px); }
    #lb-next { right: clamp(10px,2vw,32px); }
    #lb-prev:hover { color: var(--burnt); transform: translateY(-50%) translateX(-4px); }
    #lb-next:hover { color: var(--burnt); transform: translateY(-50%) translateX(4px); }
  </style>
</head>
<body>

<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<header class="hero">
  <a class="back-link" href="sketches.html" style="position:absolute;top:calc(var(--nav-h)+14px);left:clamp(24px,6vw,80px);">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 4l-5 4 5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Sketches
  </a>
  <h1 class="hero-title">SPRINT</h1>
  <div class="hero-meta">
    <span class="hero-count">6</span>
    <p>Design sprint process pages and ideation.</p>
  </div>
  <div class="hero-rule"></div>
</header>

<main class="gallery">
  <a class="gallery-item" href="#" data-num="01"><img src="assests/playground/sketches/sprint/Sprint_page_01.jpg" alt="Sprint 01" loading="lazy"></a>
  <a class="gallery-item" href="#" data-num="02"><img src="assests/playground/sketches/sprint/Sprint_page_02.jpg" alt="Sprint 02" loading="lazy"></a>
  <a class="gallery-item" href="#" data-num="03"><img src="assests/playground/sketches/sprint/Sprint_page_03.jpg" alt="Sprint 03" loading="lazy"></a>
  <a class="gallery-item" href="#" data-num="04"><img src="assests/playground/sketches/sprint/Sprint_page_04.jpg" alt="Sprint 04" loading="lazy"></a>
  <a class="gallery-item" href="#" data-num="05"><img src="assests/playground/sketches/sprint/Sprint_page_05.jpg" alt="Sprint 05" loading="lazy"></a>
  <a class="gallery-item" href="#" data-num="06"><img src="assests/playground/sketches/sprint/Sprint_page_06.jpg" alt="Sprint 06" loading="lazy"></a>
</main>

<footer>
  <span>Selin Orbay</span>
  <span><a href="sketches.html" style="color:rgba(15,15,15,.3);text-decoration:none;font-size:12px;font-weight:300;">← Back to Sketches</a></span>
</footer>

<!-- Lightbox -->
<div id="lightbox">
  <div id="lb-backdrop"></div>
  <div id="lb-frame">
    <button id="lb-close" aria-label="Close">✕</button>
    <img id="lb-img" src="" alt="">
    <div id="lb-counter"></div>
  </div>
  <button class="lb-arrow" id="lb-prev" aria-label="Previous">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M19 7l-10 8 10 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="lb-arrow" id="lb-next" aria-label="Next">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M11 7l10 8-10 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 20); }, { passive: true });

  // Lightbox
  (function() {
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lb-img');
    const lbCount = document.getElementById('lb-counter');
    const items   = Array.from(document.querySelectorAll('.gallery-item'));
    let cur = 0;

    function show(i) {
      cur = (i + items.length) % items.length;
      const src = items[cur].querySelector('img').src;
      const alt = items[cur].querySelector('img').alt;
      if (lb.classList.contains('open')) {
        lbImg.style.opacity = '0';
        setTimeout(() => { lbImg.src = src; lbImg.alt = alt; lbImg.style.opacity = '1'; }, 160);
      } else {
        lbImg.src = src; lbImg.alt = alt;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      lbCount.textContent = (cur + 1) + ' / ' + items.length;
    }

    function close() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    items.forEach((item, i) => item.addEventListener('click', e => { e.preventDefault(); show(i); }));
    document.getElementById('lb-backdrop').addEventListener('click', close);
    document.getElementById('lb-close').addEventListener('click', close);
    document.getElementById('lb-prev').addEventListener('click', () => show(cur - 1));
    document.getElementById('lb-next').addEventListener('click', () => show(cur + 1));
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')     close();
      if (e.key === 'ArrowLeft')  show(cur - 1);
      if (e.key === 'ArrowRight') show(cur + 1);
    });
  })();
</script>
</body>
</html>
