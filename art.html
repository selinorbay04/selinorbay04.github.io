  <style>
    :root {
      --burnt:   #8B3800;
      --bg:      var(--black);   /* was #1C0A00; mapped by lightness, like CAD */
      --font-graffiti: 'Bangers', cursive;
      --page-bg: var(--bg);
      --page-fg: var(--cream);

      --nav-h:             68px;
      --nav-pad-x:         clamp(24px, 4vw, 56px);
      --nav-gap:           32px;
      --nav-logo-size:     28px;
      --nav-fg:            var(--cream);
      --nav-fg-scrolled:   var(--cream);
      --nav-bg-scrolled:   var(--bg);
      --nav-line-scrolled: rgba(0,0,0,0.4);

      --footer-line: rgba(255,243,223,0.08);
      --footer-fg:   rgba(255,243,223,0.3);
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */


    /* back breadcrumb */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,243,223,0.5);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--orange); }
    .back-link svg { width: 14px; height: 14px; }


    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      padding-top: var(--nav-h);
      padding: calc(var(--nav-h) + 68px) clamp(24px, 6vw, 80px) 0;
      display: flex;
      align-items: flex-end;
      gap: clamp(16px, 3vw, 40px);
      flex-wrap: wrap;
    }

    .hero-title {
      font-family: var(--font-graffiti);
      font-size: clamp(80px, 16vw, 200px);
      letter-spacing: 8px;
      line-height: 0.88;
      color: var(--orange);
      -webkit-text-stroke: 3px var(--black);
      text-shadow:
        5px 5px 0 var(--black),
        -2px -2px 0 var(--burnt),
        0 0 60px rgba(249,115,22,.35);
    }

    .hero-meta {
      padding-bottom: clamp(10px, 1.5vw, 18px);
    }
    .hero-meta p {
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255,243,223,0.5);
      max-width: 280px;
    }
    .hero-count {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      color: var(--orange);
      letter-spacing: 2px;
      display: block;
      margin-bottom: 4px;
    }

    /* orange rule */
    .hero-rule {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--orange) 0%, rgba(249,115,22,.1) 60%, transparent 100%);
      margin: clamp(20px, 3vh, 36px) 0 0;
    }


    /* ══════════════════════════════════════
       GALLERY GRID
    ══════════════════════════════════════ */
    .gallery {
      padding: clamp(24px, 4vh, 48px) clamp(16px, 3vw, 40px) clamp(48px, 8vh, 96px);
      columns: 2;
      column-gap: clamp(10px, 1.5vw, 20px);
    }

    @media (min-width: 900px)  { .gallery { columns: 3; } }
    @media (min-width: 1300px) { .gallery { columns: 4; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: clamp(10px, 1.5vw, 20px);
      display: block;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      border: 3px solid rgba(249,115,22,.22);
      transition: border-color .3s ease, transform .35s ease, box-shadow .3s ease;
    }
    .gallery-item:hover {
      border-color: var(--orange);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(249,115,22,.28), 0 6px 16px rgba(0,0,0,.3);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .gallery-item:hover img { transform: scale(1.04); }

    /* number tag */
    .gallery-item::after {
      content: attr(data-num);
      position: absolute;
      top: 10px; right: 10px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.9);
      background: rgba(249,115,22,.75);
      padding: 2px 7px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .gallery-item:hover::after { opacity: 1; }


    .pg-back { position: absolute; top: calc(var(--nav-h) + 14px); left: clamp(24px, 6vw, 80px); color: var(--cream); }
    .hero { position: relative; }

  </style>
</head>
