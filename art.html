<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --black:   #0f0f0f;
      --bg:      #1C0A00;
      --nav-h:   68px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-graffiti: 'Bangers', cursive;
      --font-body:     'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--cream);
      overflow-x: hidden;
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      transition: background 0.4s ease;
    }
    nav.scrolled {
      background: var(--bg);
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--cream); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--cream); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .5; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }

    /* back breadcrumb */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,243,223,0.5);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--orange); }
    .back-link svg { width: 14px; height: 14px; }


    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      padding-top: var(--nav-h);
      padding: calc(var(--nav-h) + 40px) clamp(24px, 6vw, 80px) 0;
      display: flex;
      align-items: flex-end;
      gap: clamp(16px, 3vw, 40px);
      flex-wrap: wrap;
    }

    .hero-title {
      font-family: var(--font-graffiti);
      font-size: clamp(80px, 16vw, 200px);
      letter-spacing: 8px;
      line-height: 0.88;
      color: var(--orange);
      -webkit-text-stroke: 3px var(--black);
      text-shadow:
        5px 5px 0 var(--black),
        -2px -2px 0 var(--burnt),
        0 0 60px rgba(249,115,22,.35);
    }

    .hero-meta {
      padding-bottom: clamp(10px, 1.5vw, 18px);
    }
    .hero-meta p {
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255,243,223,0.5);
      max-width: 280px;
    }
    .hero-count {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      color: var(--orange);
      letter-spacing: 2px;
      display: block;
      margin-bottom: 4px;
    }

    /* orange rule */
    .hero-rule {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--orange) 0%, rgba(249,115,22,.1) 60%, transparent 100%);
      margin: clamp(20px, 3vh, 36px) 0 0;
    }


    /* ══════════════════════════════════════
       GALLERY GRID
    ══════════════════════════════════════ */
    .gallery {
      padding: clamp(24px, 4vh, 48px) clamp(16px, 3vw, 40px) clamp(48px, 8vh, 96px);
      columns: 2;
      column-gap: clamp(10px, 1.5vw, 20px);
    }

    @media (min-width: 900px)  { .gallery { columns: 3; } }
    @media (min-width: 1300px) { .gallery { columns: 4; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: clamp(10px, 1.5vw, 20px);
      display: block;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      border: 3px solid rgba(249,115,22,.22);
      transition: border-color .3s ease, transform .35s ease, box-shadow .3s ease;
    }
    .gallery-item:hover {
      border-color: var(--orange);
      transform: translateY(-4px) rotate(0.4deg);
      box-shadow: 0 16px 48px rgba(249,115,22,.28), 0 6px 16px rgba(0,0,0,.3);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .gallery-item:hover img { transform: scale(1.04); }

    /* number tag */
    .gallery-item::after {
      content: attr(data-num);
      position: absolute;
      top: 10px; right: 10px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.9);
      background: rgba(249,115,22,.75);
      padding: 2px 7px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .gallery-item:hover::after { opacity: 1; }


    /* ══════════════════════════════════════
       FOOTER
    ══════════════════════════════════════ */
    footer {
      border-top: 1px solid rgba(255,243,223,0.08);
      padding: 24px clamp(24px, 6vw, 80px);
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    footer span {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,243,223,0.3);
      letter-spacing: 0.5px;
    }

  </style>
</head>
