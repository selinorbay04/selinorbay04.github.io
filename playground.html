<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #EDE0CC;
      font-family: var(--font-body);
    }

    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--black); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--black); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .45; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }


    /* ══════════════════════════════════════
       STAGE
    ══════════════════════════════════════ */
    #stage {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: none;
    }

    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--black);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width: 34px; height: 34px; background: var(--orange); }


    /* ══════════════════════════════════════
       KEYWORDS  (background layer)
    ══════════════════════════════════════ */
    .keyword {
      position: absolute;
      font-family: var(--font-graffiti);
      letter-spacing: 6px;
      line-height: 1;
      text-decoration: none;
      cursor: none;
      user-select: none;
      will-change: transform;
      z-index: 1;
      transition: letter-spacing .25s ease, filter .25s ease;
    }
    .keyword:hover { letter-spacing: 10px; filter: brightness(1.12); }

    .keyword-art {
      font-size: clamp(80px, 13vw, 186px);
      color: var(--orange);
      -webkit-text-stroke: 3px var(--black);
      text-shadow: 5px 5px 0 var(--black), -2px -2px 0 var(--burnt), 8px 10px 14px rgba(0,0,0,.25);
    }
    .keyword-sketches {
      font-size: clamp(52px, 8vw, 115px);
      color: var(--cream);
      -webkit-text-stroke: 2.5px var(--black);
      text-shadow: 4px 4px 0 var(--black), -3px -1px 0 var(--burnt), 7px 9px 12px rgba(0,0,0,.30);
    }
    .keyword-cad {
      font-size: clamp(80px, 13vw, 186px);
      color: var(--green);
      -webkit-text-stroke: 3px var(--black);
      text-shadow: 5px 5px 0 var(--black), -2px -3px 0 #1a2510, 6px 8px 12px rgba(0,0,0,.30);
    }


    /* ══════════════════════════════════════
       IMAGE CARDS  (foreground layer)
    ══════════════════════════════════════ */
    .float-img {
      position: absolute;
      display: block;
      border-radius: 14px;
      overflow: hidden;
      cursor: none;
      text-decoration: none;
      will-change: transform;
      z-index: 2;
      transition: box-shadow .3s ease;
    }
    .float-img img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: transform .45s ease;
    }
    .float-img:hover img { transform: scale(1.05); }

    /* portrait card (3:4) */
    .img-p { aspect-ratio: 3 / 4; width: clamp(110px, 13vw, 187px); }
    /* portrait slightly narrower */
    .img-pn { aspect-ratio: 3 / 4; width: clamp(105px, 12.5vw, 180px); }
    /* landscape card (4:3) */
    .img-l { aspect-ratio: 4 / 3; width: clamp(145px, 16vw, 230px); }

    /* coloured borders per category */
    .cat-art {
      border: 4px solid var(--orange);
      box-shadow: 0 6px 28px rgba(249,115,22,.25), 0 2px 8px rgba(0,0,0,.12);
    }
    .cat-sketches {
      border: 4px solid var(--burnt);
      box-shadow: 0 6px 28px rgba(139,56,0,.22), 0 2px 8px rgba(0,0,0,.12);
    }
    .cat-cad {
      border: 4px solid var(--green);
      box-shadow: 0 6px 28px rgba(52,69,36,.28), 0 2px 8px rgba(0,0,0,.12);
    }
    .cat-art:hover     { box-shadow: 0 14px 44px rgba(249,115,22,.40), 0 4px 12px rgba(0,0,0,.15); }
    .cat-sketches:hover{ box-shadow: 0 14px 44px rgba(139,56,0,.36),   0 4px 12px rgba(0,0,0,.15); }
    .cat-cad:hover     { box-shadow: 0 14px 44px rgba(52,69,36,.42),   0 4px 12px rgba(0,0,0,.15); }

  </style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<!-- ════════════════════════════════════════════════
     STAGE
     Layout guarantee: items are placed in 3 vertical
     columns (ART / SKETCHES / CAD) with rows spaced
     so that even at MAX parallax drift no two image
     bounding boxes touch each other.
     MAX=25, depth 0.06–0.30  →  max drift ≈ 7.5px/axis
     All image-to-image gaps verified ≥ 18px (> 15px needed).
     Keywords sit at z-index:1 (background); images z-index:2.
════════════════════════════════════════════════ -->
<div id="stage">

  <!-- ══ ART KEYWORD ══ -->
  <a class="keyword keyword-art"
     href="art.html" data-rot="-5deg" data-depth="0.06"
     style="left:3%; top:48%;">ART</a>

  <!-- ══ ART IMAGES — left column ══ -->
  <a class="float-img cat-art img-p" href="art.html"
     data-rot="3deg" data-depth="0.25"
     style="left:2%; top:3%;">
    <img src="assests/playground/display/Drawing_03.jpg" alt="Drawing">
  </a>

  <a class="float-img cat-art img-pn" href="art.html"
     data-rot="-2deg" data-depth="0.18"
     style="left:12%; top:35.5%;">
    <img src="assests/playground/display/Drawing_12.jpg" alt="Drawing">
  </a>

  <a class="float-img cat-art img-p" href="art.html"
     data-rot="-4deg" data-depth="0.30"
     style="left:1.5%; top:67.5%;">
    <img src="assests/playground/display/Drawing_07.jpg" alt="Drawing">
  </a>


  <!-- ══ SKETCHES KEYWORD ══ -->
  <a class="keyword keyword-sketches"
     href="sketches.html" data-rot="3deg" data-depth="0.06"
     style="left:30%; top:47%;">SKETCHES</a>

  <!-- ══ SKETCHES IMAGES — centre columns ══
       Left sketch col:  26–26.5%
       Right sketch col: 43%
       Verified gap between cols: ≥ 26px at all viewport widths.
  ══ -->
  <a class="float-img cat-sketches img-p" href="sketches.html"
     data-rot="2.5deg" data-depth="0.22"
     style="left:26.5%; top:2.5%;">
    <img src="assests/playground/display/shoes_01.jpg" alt="Shoe sketch">
  </a>

  <a class="float-img cat-sketches img-p" href="sketches.html"
     data-rot="-3deg" data-depth="0.15"
     style="left:43%; top:2%;">
    <img src="assests/playground/display/coffee_maker_01.jpg" alt="Coffee maker sketch">
  </a>

  <a class="float-img cat-sketches img-p" href="sketches.html"
     data-rot="2deg" data-depth="0.28"
     style="left:26%; top:36%;">
    <img src="assests/playground/display/Sprint_page_05.jpg" alt="Sprint sketch">
  </a>

  <a class="float-img cat-sketches img-p" href="sketches.html"
     data-rot="-1.5deg" data-depth="0.20"
     style="left:43%; top:35.5%;">
    <img src="assests/playground/display/Bus_stop_02.jpg" alt="Bus stop sketch">
  </a>

  <a class="float-img cat-sketches img-p" href="sketches.html"
     data-rot="3.5deg" data-depth="0.24"
     style="left:26.5%; top:68.5%;">
    <img src="assests/playground/display/Bus_stop_17.jpg" alt="Bus stop sketch">
  </a>

  <a class="float-img cat-sketches img-p" href="sketches.html"
     data-rot="-2deg" data-depth="0.17"
     style="left:43%; top:67.5%;">
    <img src="assests/playground/display/coffee_maker_11.jpg" alt="Coffee maker sketch">
  </a>


  <!-- ══ CAD KEYWORD ══ -->
  <a class="keyword keyword-cad"
     href="cad.html" data-rot="-2deg" data-depth="0.06"
     style="left:71%; top:73%;">CAD</a>

  <!-- ══ CAD IMAGES — right column ══
       All at left:68–68.5%; stacked rows at 3% / 26% / 49%
       Vertical gaps verified ≥ 18px (landscape cards shorter).
  ══ -->
  <a class="float-img cat-cad img-l" href="cad.html"
     data-rot="-3deg" data-depth="0.20"
     style="left:68%; top:3%;">
    <img src="assests/playground/display/CAD_01.png" alt="CAD model">
  </a>

  <a class="float-img cat-cad img-l" href="cad.html"
     data-rot="2deg" data-depth="0.15"
     style="left:67.5%; top:26%;">
    <img src="assests/playground/display/CAD_02.png" alt="CAD model">
  </a>

  <a class="float-img cat-cad img-l" href="cad.html"
     data-rot="-1deg" data-depth="0.25"
     style="left:68.5%; top:49%;">
    <img src="assests/playground/display/CAD_03.png" alt="CAD model">
  </a>

</div><!-- /stage -->


<script>
  const cursor = document.getElementById('cursor');
  const items  = document.querySelectorAll('.keyword, .float-img');

  let mx = 0, my = 0, lx = 0, ly = 0;

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  items.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });

  /* MAX = 25 px  |  depth range 0.06–0.30  →  max drift ≈ 7.5 px/axis
     All layout gaps verified ≥ 18 px ≫ 15 px (2 × 7.5), so items
     never overlap even at full cursor deflection.                      */
  const MAX = 25;

  (function loop() {
    lx += (mx - lx) * 0.075;
    ly += (my - ly) * 0.075;
    items.forEach(el => {
      const d   = parseFloat(el.dataset.depth) || 0.1;
      const rot = el.dataset.rot || '0deg';
      el.style.transform =
        `translate(${lx * d * MAX}px, ${ly * d * MAX}px) rotate(${rot})`;
    });
    requestAnimationFrame(loop);
  })();
</script>

</body>
</html>
