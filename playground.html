<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --bg:      #5C7040;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --divider: rgba(245, 227, 200, 0.18);
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      border-bottom: 1px solid var(--divider);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--cream); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--cream); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .5; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }


    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--cream);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width: 34px; height: 34px; background: var(--orange); }
    @media (hover: none) { #cursor { display: none; } }


    /* ══════════════════════════════════════
       3-COLUMN GRID
    ══════════════════════════════════════ */
    .pg-grid {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      cursor: none;
    }

    /* ── Single column ── */
    .pg-col {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border-right: 1px solid var(--divider);
    }
    .pg-col:last-child { border-right: none; }


    /* ── Keyword cell ── */
    .col-kw {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      padding: 10px 8px;
      transition: background .25s ease;
      cursor: none;
    }
    .col-kw:hover { background: rgba(0,0,0,0.06); }

    .kw-text {
      font-family: var(--font-graffiti);
      line-height: 1;
      letter-spacing: 5px;
      display: block;
      user-select: none;
      text-align: center;
      transition: letter-spacing .28s ease, filter .28s ease;
    }
    .col-kw:hover .kw-text { letter-spacing: 9px; filter: brightness(1.12); }

    /* ART — orange */
    .kw-art {
      font-size: clamp(52px, 8vw, 114px);
      color: var(--orange);
      -webkit-text-stroke: 2.5px var(--black);
      text-shadow: 4px 4px 0 var(--black), -1px -1px 0 var(--burnt), 6px 8px 14px rgba(0,0,0,.3);
    }
    /* SKETCHES — cream */
    .kw-sketches {
      font-size: clamp(26px, 3.8vw, 55px);
      color: var(--cream);
      -webkit-text-stroke: 2px var(--black);
      text-shadow: 3px 3px 0 var(--black), -1px -1px 0 rgba(139,56,0,.5), 5px 7px 12px rgba(0,0,0,.35);
    }
    /* CAD — dark green */
    .kw-cad {
      font-size: clamp(52px, 8vw, 114px);
      color: #1a2510;
      -webkit-text-stroke: 2.5px rgba(245,227,200,.55);
      text-shadow: 3px 3px 0 rgba(0,0,0,.4), 5px 7px 12px rgba(0,0,0,.3);
    }


    /* ── Image cell ── */
    .col-img {
      flex: 1;
      min-height: 0;
      display: block;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      cursor: none;
    }

    /* landscape override — shorter cell */
    .col-img-land {
      flex: 0 0 auto;
      height: calc(((100vw / 3)) * 0.56);  /* ~16:9 within one column */
    }

    .col-img img {
      width: 100%; height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transition: transform .5s ease;
    }
    .col-img:hover img { transform: scale(1.04); }

    /* hover darkening overlay (same pattern as projects.html) */
    .col-img::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.32);
      opacity: 0;
      z-index: 1;
      transition: opacity .4s ease;
      pointer-events: none;
    }
    .col-img:hover::before { opacity: 1; }

    /* thin cream horizontal separator between cells in a column */
    .col-img + .col-img,
    .col-img + .col-kw,
    .col-kw  + .col-img {
      border-top: 1px solid var(--divider);
    }


    /* ══════════════════════════════════════
       MOBILE / SMALL SCREEN
       Hide images; each column becomes a big
       keyword link that fills equal height.
    ══════════════════════════════════════ */
    @media (max-width: 767px) {
      html, body { overflow: hidden; }

      .pg-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr;
      }

      /* stack columns vertically */
      .pg-col {
        border-right: none;
        border-bottom: 1px solid var(--divider);
      }
      .pg-col:last-child { border-bottom: none; }

      /* hide all images */
      .col-img { display: none; }

      /* keyword fills the whole column */
      .col-kw {
        flex: 1;
        border-top: none !important;
      }

      /* bigger font on mobile single-keyword view */
      .kw-art     { font-size: clamp(72px, 20vw, 120px); }
      .kw-sketches{ font-size: clamp(48px, 13vw, 88px);  }
      .kw-cad     { font-size: clamp(72px, 20vw, 120px); }
    }

  </style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>


<!-- ════════════════════════════════════════
     3-COLUMN PLAYGROUND GRID
════════════════════════════════════════ -->
<div class="pg-grid">

  <!-- ══════════════
       LEFT — ART
  ══════════════ -->
  <div class="pg-col">

    <!-- keyword at top -->
    <a class="col-kw" href="art.html">
      <span class="kw-text kw-art">ART</span>
    </a>

    <!-- Drawing 13 -->
    <a class="col-img" href="art.html">
      <img src="assests/playground/drawings/Drawing_13.jpg" alt="Drawing 13" loading="lazy">
    </a>

    <!-- Drawing 01 -->
    <a class="col-img" href="art.html">
      <img src="assests/playground/drawings/Drawing_01.jpg" alt="Drawing 01" loading="lazy">
    </a>

    <!-- Drawing 14 -->
    <a class="col-img" href="art.html">
      <img src="assests/playground/drawings/Drawing_14.jpg" alt="Drawing 14" loading="lazy">
    </a>

  </div>


  <!-- ════════════════
       MIDDLE — SKETCHES
  ════════════════ -->
  <div class="pg-col">

    <!-- Coffee maker (top image) -->
    <a class="col-img" href="sketches.html">
      <img src="assests/playground/sketches/coffeemaker/coffee_maker_01.jpg" alt="Coffee maker sketch" loading="lazy">
    </a>

    <!-- keyword in the middle -->
    <a class="col-kw" href="sketches.html">
      <span class="kw-text kw-sketches">SKETCHES</span>
    </a>

    <!-- Shoes — landscape crop -->
    <a class="col-img col-img-land" href="sketches.html">
      <img src="assests/playground/sketches/shoes/shoes_01.jpg"
           alt="Shoe sketch"
           style="object-position: center 30%;"
           loading="lazy">
    </a>

    <!-- Sprint -->
    <a class="col-img" href="sketches.html">
      <img src="assests/playground/sketches/sprint/Sprint_page_05.jpg" alt="Sprint sketch" loading="lazy">
    </a>

  </div>


  <!-- ═══════════════
       RIGHT — CAD
       Images: CAD_01 = CT scanner, CAD_02 = Dodecahedron, CAD_03 = Vase
       Update src paths below once you rename / move the files.
  ═══════════════ -->
  <div class="pg-col">

    <!-- CT scanner -->
    <a class="col-img" href="cad.html">
      <img src="assests/playground/images_to_display/CT_.png" alt="CT scanner CAD model" loading="lazy">
    </a>

    <!-- Dodecahedron -->
    <a class="col-img" href="cad.html">
      <img src="assests/playground/images_to_display/Dode_.png" alt="Dodecahedron CAD model" loading="lazy">
    </a>

    <!-- keyword -->
    <a class="col-kw" href="cad.html">
      <span class="kw-text kw-cad">CAD</span>
    </a>

    <!-- Vase -->
    <a class="col-img" href="cad.html">
      <img src="assests/playground/images_to_display/Vase_.png" alt="Vase CAD model" loading="lazy">
    </a>

  </div>

</div><!-- /pg-grid -->


<script>
  /* custom cursor */
  const cursor = document.getElementById('cursor');
  const links  = document.querySelectorAll('a');

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  links.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
</script>

</body>
</html>
