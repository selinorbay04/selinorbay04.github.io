<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #EDE0CC;
      font-family: var(--font-body);
    }

    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      background: #EDE0CC;
      border-bottom: 1px solid rgba(15,15,15,0.06);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--black); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--black); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .45; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }


    /* ══════════════════════════════════════
       STAGE  — 3 stacked bands
    ══════════════════════════════════════ */
    #stage {
      position: fixed;
      inset: 0;
      padding-top: var(--nav-h);
      display: flex;
      flex-direction: column;
      cursor: none;
    }

    /* each category band */
    .cat-band {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 clamp(16px, 2.5vw, 40px);
      gap: clamp(8px, 1.4vw, 20px);
      overflow: hidden;  /* clips parallax at band boundary — zero cross-band overlap */
    }

    /* coloured left rule per band */
    .cat-band::before {
      content: '';
      position: absolute;
      left: 0; top: 8%; bottom: 8%;
      width: 4px;
      border-radius: 2px;
    }

    /* subtle tinted backgrounds */
    .band-art      { background: rgba(249,115,22,0.06); }
    .band-art::before { background: var(--orange); }

    .band-sketches { background: rgba(139,56,0,0.05); }
    .band-sketches::before { background: var(--burnt); }

    .band-cad      { background: rgba(52,69,36,0.07); }
    .band-cad::before { background: var(--green); }

    /* hairline dividers between bands */
    .cat-band + .cat-band {
      border-top: 1px solid rgba(15,15,15,0.09);
    }


    /* ══════════════════════════════════════
       GRAFFITI KEYWORDS
    ══════════════════════════════════════ */
    .band-keyword {
      font-family: var(--font-graffiti);
      letter-spacing: 5px;
      line-height: 1;
      flex-shrink: 0;
      cursor: none;
      user-select: none;
      text-decoration: none;
      display: block;
      transition: letter-spacing .28s ease, filter .28s ease;
      will-change: transform;
    }
    .band-keyword:hover { letter-spacing: 9px; filter: brightness(1.12); }

    .kw-art {
      font-size: clamp(56px, 9vw, 118px);
      color: var(--orange);
      -webkit-text-stroke: 2.5px var(--black);
      text-shadow: 4px 4px 0 var(--black), -1px -1px 0 var(--burnt), 6px 9px 14px rgba(0,0,0,.22);
      transform: rotate(-5deg);
      width: clamp(90px, 12vw, 160px);
    }
    .kw-sketches {
      font-size: clamp(30px, 4.5vw, 60px);
      color: var(--cream);
      -webkit-text-stroke: 2px var(--black);
      text-shadow: 3px 3px 0 var(--black), -2px -1px 0 var(--burnt), 5px 8px 12px rgba(0,0,0,.28);
      transform: rotate(3deg);
      width: clamp(130px, 18vw, 240px);
    }
    .kw-cad {
      font-size: clamp(56px, 9vw, 118px);
      color: var(--green);
      -webkit-text-stroke: 2.5px var(--black);
      text-shadow: 4px 4px 0 var(--black), -1px -2px 0 #1a2510, 6px 8px 12px rgba(0,0,0,.22);
      transform: rotate(-2deg);
      width: clamp(90px, 12vw, 160px);
    }


    /* ══════════════════════════════════════
       IMAGE CARDS
    ══════════════════════════════════════ */
    .float-img {
      display: block;
      border-radius: 13px;
      overflow: hidden;
      cursor: none;
      text-decoration: none;
      flex-shrink: 0;
      will-change: transform;
      transition: box-shadow .3s ease;
    }
    .float-img img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: transform .45s ease;
    }
    .float-img:hover img { transform: scale(1.05); }

    .cat-art     { border: 3.5px solid var(--orange);
                   box-shadow: 0 5px 22px rgba(249,115,22,.24), 0 2px 6px rgba(0,0,0,.1); }
    .cat-sketches{ border: 3.5px solid var(--burnt);
                   box-shadow: 0 5px 22px rgba(139,56,0,.22),   0 2px 6px rgba(0,0,0,.1); }
    .cat-cad     { border: 3.5px solid var(--green);
                   box-shadow: 0 5px 22px rgba(52,69,36,.24),   0 2px 6px rgba(0,0,0,.1); }

    .cat-art:hover     { box-shadow: 0 12px 36px rgba(249,115,22,.40), 0 4px 12px rgba(0,0,0,.14); }
    .cat-sketches:hover{ box-shadow: 0 12px 36px rgba(139,56,0,.36),   0 4px 12px rgba(0,0,0,.14); }
    .cat-cad:hover     { box-shadow: 0 12px 36px rgba(52,69,36,.40),   0 4px 12px rgba(0,0,0,.14); }

    /* portrait card  (3:4) */
    .img-portrait {
      height: calc((100vh - var(--nav-h)) / 3 - 32px);
      aspect-ratio: 3 / 4;
    }
    /* landscape card (4:3) */
    .img-landscape {
      height: calc((100vh - var(--nav-h)) / 3 - 36px);
      aspect-ratio: 4 / 3;
    }
    /* square card */
    .img-square {
      height: calc((100vh - var(--nav-h)) / 3 - 32px);
      aspect-ratio: 1;
    }

    /* stagger alignment */
    .align-top    { align-self: flex-start; margin-top: 10px; }
    .align-mid    { align-self: center; }
    .align-bottom { align-self: flex-end; margin-bottom: 10px; }


    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--black);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width: 34px; height: 34px; background: var(--orange); }

  </style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>

<!-- STAGE -->
<div id="stage">

    <a class="float-img cat-art img-portrait align-mid float-item"

    <a class="float-img cat-art img-portrait align-top float-item"

    <a class="float-img cat-sketches img-portrait align-bottom float-item"

    <a class="float-img cat-sketches img-portrait align-mid float-item"

    <a class="float-img cat-cad img-landscape align-top float-item"

    <a class="float-img cat-cad img-landscape align-top float-item"

</div><!-- /stage -->


<script>
  const cursor = document.getElementById('cursor');
  const items  = document.querySelectorAll('.float-item');

  let mx = 0, my = 0, lx = 0, ly = 0;

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  items.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });

  // Read base rotation from data-rot attribute (avoids inline-style collision)
  const MAX = 18;

  (function loop() {
    lx += (mx - lx) * 0.072;
    ly += (my - ly) * 0.072;
    items.forEach(el => {
      const d   = parseFloat(el.dataset.depth) || 0.1;
      const rot = el.dataset.rot || '0deg';
      el.style.transform = `translate(${lx * d * MAX}px, ${ly * d * MAX}px) rotate(${rot})`;
    });
    requestAnimationFrame(loop);
  })();
</script>

</body>
