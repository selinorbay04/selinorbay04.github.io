<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:  #FFF3DF;
      --orange: #F97316;
      --burnt:  #8B3800;
      --black:  #0f0f0f;
      --nav-h:  68px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-graffiti:'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;         /* no scroll — pure cursor canvas */
      background: #EDE0CC;      /* warm parchment, feels different from other pages */
      font-family: var(--font-body);
    }

    /* ══════════════════════════════════════
       NAV — always light since bg is warm
    ══════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      /* transparent — the stage is always the warm bg */
    }

    .logo {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--black);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--black);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.45; }
    .nav-links a.active {
      text-decoration: underline;
      text-underline-offset: 4px;
    }


    /* ══════════════════════════════════════
       STAGE — full screen floating canvas
    ══════════════════════════════════════ */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: none;   /* we draw our own cursor */
    }

    /* Custom cursor dot */
    #cursor {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--black);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.25s ease, height 0.25s ease, background 0.25s ease;
    }
    #cursor.hover {
      width: 36px;
      height: 36px;
      background: var(--orange);
    }


    /* ══════════════════════════════════════
       FLOATING ITEMS — keywords + images
    ══════════════════════════════════════ */
    .float-item {
      position: absolute;
      will-change: transform;
      /* JS applies transform; CSS handles hover + base rotation */
    }


    /* ── Graffiti keywords ── */
    .keyword {
      font-family: var(--font-graffiti);
      letter-spacing: 5px;
      line-height: 1;
      text-decoration: none;
      display: block;
      cursor: none;
      user-select: none;
      transition: filter 0.25s ease, letter-spacing 0.25s ease;
    }

    .keyword-art {
      font-size: clamp(80px, 14vw, 180px);
      color: var(--orange);
      -webkit-text-stroke: 3px var(--black);
      text-shadow:
        5px 5px 0 var(--black),
        -2px -2px 0 var(--burnt),
        8px 10px 12px rgba(0,0,0,0.25);
      transform: rotate(-4deg);
    }

    .keyword-sketches {
      font-size: clamp(56px, 9vw, 120px);
      color: var(--cream);
      -webkit-text-stroke: 3px var(--black);
      text-shadow:
        4px 4px 0 var(--black),
        -3px -1px 0 #5a1200,
        7px 9px 10px rgba(0,0,0,0.3);
      transform: rotate(2.5deg);
    }

    .keyword-cad {
      font-size: clamp(80px, 13vw, 172px);
      color: #344524;
      -webkit-text-stroke: 3px var(--black);
      text-shadow:
        5px 5px 0 var(--black),
        -2px -3px 0 #1a2510,
        6px 8px 10px rgba(0,0,0,0.3);
      transform: rotate(-2deg);
    }

    .keyword:hover {
      letter-spacing: 8px;
      filter: brightness(1.15);
    }


    /* ── Image boxes ── */
    .float-img {
      display: block;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.1);
      cursor: none;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      text-decoration: none;
      /* base size set inline per item */
    }

    .float-img img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .float-img:hover {
      box-shadow: 0 16px 48px rgba(0,0,0,0.28), 0 4px 12px rgba(0,0,0,0.14);
    }

    /* Small category badge on each image */
    .float-img .badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.45);
      padding: 3px 7px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .float-img { position: absolute; }

  </style>
</head>

<script>
  /* ════════════════════════════════════════
     CURSOR PARALLAX
     — lerp loop for smooth, lag-y following
  ════════════════════════════════════════ */
  const cursor = document.getElementById('cursor');
  const items  = document.querySelectorAll('.float-item');

  // Raw mouse position (normalized -1 … 1 from center)
  let mx = 0, my = 0;
  // Lerped position
  let lx = 0, ly = 0;

  // Track raw cursor position
  document.addEventListener('mousemove', e => {
    // Update custom cursor position (no lerp — should follow exactly)
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY  + 'px';

    // Normalized offset from center (-1 to 1)
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  // Grow cursor on hover
  document.querySelectorAll('.float-item').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });

  // Store each item's BASE rotation from inline style
  const baseRotations = {};
  items.forEach((el, i) => {
    const style = el.getAttribute('style') || '';
    const match = style.match(/rotate\(([^)]+)\)/);
    baseRotations[i] = match ? match[1] : '0deg';
  });

  const MAX_SHIFT = 110; // max px shift at depth = 1

  // RAF loop — lerp toward mouse, apply per-item
  function loop() {
    const ease = 0.075;
    lx += (mx - lx) * ease;
    ly += (my - ly) * ease;

    items.forEach((el, i) => {
      const depth = parseFloat(el.dataset.depth) || 0.3;
      const tx = lx * depth * MAX_SHIFT;
      const ty = ly * depth * MAX_SHIFT;
      el.style.transform = `translate(${tx}px, ${ty}px) rotate(${baseRotations[i]})`;
    });

    requestAnimationFrame(loop);
  }
  loop();
</script>
