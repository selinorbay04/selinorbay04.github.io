<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --bg:      #5C7040;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --divider: rgba(245, 227, 200, 0.18);
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      border-bottom: 1px solid var(--divider);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--cream); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--cream); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .5; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }


    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--cream);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width: 34px; height: 34px; background: var(--orange); }
    @media (hover: none) { #cursor { display: none; } }


    /* ══════════════════════════════════════
       3 × 3 GRID
       3 vertical columns, 3 rows.
       Column 1 = ART, Column 2 = SKETCHES, Column 3 = CAD.
       Labels on the diagonal: (col1,row1) · (col2,row2) · (col3,row3)
       1px gap bleeds --divider colour as full-height column dividers.
    ══════════════════════════════════════ */
    .pg-grid {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows:    1fr 1fr 1fr;
      gap: 1px;
      background: var(--divider);
      cursor: none;
    }


    /* ── Explicit cell positions ──────────
       Each category stays in its own column (vertical).
       Labels hit the diagonal.
    ─────────────────────────────────────── */

    /* Column 1 — ART */
    .cell-art-label { grid-column: 1; grid-row: 1; }  /* diagonal (1,1) */
    .cell-art-img1  { grid-column: 1; grid-row: 2; }
    .cell-art-img2  { grid-column: 1; grid-row: 3; }

    /* Column 2 — SKETCHES */
    .cell-sk-img1   { grid-column: 2; grid-row: 1; }
    .cell-sk-label  { grid-column: 2; grid-row: 2; }  /* diagonal (2,2) */
    .cell-sk-img2   { grid-column: 2; grid-row: 3; }

    /* Column 3 — CAD */
    .cell-cad-img1  { grid-column: 3; grid-row: 1; }
    .cell-cad-img2  { grid-column: 3; grid-row: 2; }
    .cell-cad-label { grid-column: 3; grid-row: 3; }  /* diagonal (3,3) */


    /* ── Label cell ─────────────────────── */
    .pg-label {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 10px 8px;
      cursor: none;
      box-shadow: inset 0 0 0 1px var(--cream);
      transition: background .25s ease;
    }
    .pg-label:hover { background: rgba(0,0,0,0.06); }

    .kw-text {
      font-family: var(--font-graffiti);
      line-height: 1;
      letter-spacing: 5px;
      display: block;
      user-select: none;
      text-align: center;
      transition: letter-spacing .28s ease, filter .28s ease;
    }
    .pg-label:hover .kw-text { letter-spacing: 9px; filter: brightness(1.12); }

    /* ART — orange */
    .kw-art {
      font-size: clamp(52px, 8vw, 114px);
      color: var(--orange);
      -webkit-text-stroke: 2.5px var(--black);
      text-shadow: 4px 4px 0 var(--black), -1px -1px 0 var(--burnt), 6px 8px 14px rgba(0,0,0,.3);
    }
    /* SKETCHES — cream */
    .kw-sketches {
      font-size: clamp(26px, 3.8vw, 55px);
      color: var(--cream);
      -webkit-text-stroke: 2px var(--black);
      text-shadow: 3px 3px 0 var(--black), -1px -1px 0 rgba(139,56,0,.5), 5px 7px 12px rgba(0,0,0,.35);
    }
    /* CAD — dark green */
    .kw-cad {
      font-size: clamp(52px, 8vw, 114px);
      color: #1a2510;
      -webkit-text-stroke: 2.5px rgba(245,227,200,.55);
      text-shadow: 3px 3px 0 rgba(0,0,0,.4), 5px 7px 12px rgba(0,0,0,.3);
    }


    /* ── Image cell ─────────────────────── */
    .pg-img {
      display: block;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      cursor: none;
    }

    .pg-img img {
      width: 100%; height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transition: transform .5s ease;
    }
    .pg-img:hover img { transform: scale(1.04); }

    /* sketch images: rotated -90° and scaled to fill the landscape cell */
    .pg-img--rotated img {
      position: absolute;
      top: 50%; left: 50%;
      /* swap cell dimensions: pre-rotation width = cell height, pre-rotation height = cell width */
      width:  calc((100vh - var(--nav-h)) / 3);
      height: calc(100vw / 3);
      object-fit: cover;
      transform: translate(-50%, -50%) rotate(-90deg);
      transition: transform .5s ease;
    }
    .pg-img--rotated:hover img {
      transform: translate(-50%, -50%) rotate(-90deg) scale(1.04);
    }

    /* split pair: two images side-by-side in one cell */
    .split-pair {
      display: flex;
      width: 100%; height: 100%;
    }
    .pg-img .split-pair img {
      width: 50%; height: 100%;
      flex-shrink: 0;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .pg-img:hover .split-pair img { transform: scale(1.04); }

    /* hover darkening overlay */
    .pg-img::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.32);
      opacity: 0; z-index: 1;
      transition: opacity .4s ease;
      pointer-events: none;
    }
    .pg-img:hover::before { opacity: 1; }


    /* ══════════════════════════════════════
       MOBILE — single column, labels only
    ══════════════════════════════════════ */
    @media (max-width: 767px) {
      html, body { overflow: hidden; }

      .pg-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        column-gap: 0;
      }

      .pg-img { display: none; }

      /* stack labels in their natural column order */
      .cell-art-label { grid-column: 1; grid-row: 1; }
      .cell-sk-label  { grid-column: 1; grid-row: 2; }
      .cell-cad-label { grid-column: 1; grid-row: 3; }

      .kw-art      { font-size: clamp(72px, 20vw, 120px); }
      .kw-sketches { font-size: clamp(48px, 13vw, 88px);  }
      .kw-cad      { font-size: clamp(72px, 20vw, 120px); }
    }

  </style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>


<!-- ════════════════════════════════════════
     3 × 3 PLAYGROUND GRID
     Column 1 = ART   (label row 1 — top-left)
     Column 2 = SKETCHES (label row 2 — centre)
     Column 3 = CAD   (label row 3 — bottom-right)
════════════════════════════════════════ -->
<div class="pg-grid">

  <!-- ── Column 1 — ART ── -->
  <a class="pg-label cell-art-label" href="art.html">
    <span class="kw-text kw-art">ART</span>
  </a>
  <a class="pg-img cell-art-img1" href="art.html">
    <img src="assests/playground/drawings/Drawing_13.jpg" alt="Drawing 13" loading="lazy">
  </a>
  <a class="pg-img cell-art-img2" href="art.html">
    <div class="split-pair">
      <img src="assests/playground/drawings/Drawing_03.jpg" alt="Drawing 03" loading="lazy">
      <img src="assests/playground/drawings/Drawing_04.jpg" alt="Drawing 04" loading="lazy">
    </div>
  </a>

  <!-- ── Column 2 — SKETCHES ── -->
  <a class="pg-img pg-img--rotated cell-sk-img1" href="sketches.html">
    <img src="assests/playground/sketches/coffeemaker/coffee_maker_01.jpg" alt="Coffee maker sketch" loading="lazy">
  </a>
  <a class="pg-label cell-sk-label" href="sketches.html">
    <span class="kw-text kw-sketches">SKETCHES</span>
  </a>
  <a class="pg-img pg-img--rotated cell-sk-img2" href="sketches.html">
    <img src="assests/playground/sketches/shoes/shoes_01.jpg" alt="Shoe sketch" loading="lazy">
  </a>

  <!-- ── Column 3 — CAD ── -->
  <a class="pg-img cell-cad-img1" href="cad.html">
    <img src="assests/playground/images_to_display/CT_.png" alt="CT scanner CAD model" loading="lazy">
  </a>
  <a class="pg-img cell-cad-img2" href="cad.html">
    <img src="assests/playground/images_to_display/Dode_.png" alt="Dodecahedron CAD model" loading="lazy">
  </a>
  <a class="pg-label cell-cad-label" href="cad.html">
    <span class="kw-text kw-cad">CAD</span>
  </a>

</div><!-- /pg-grid -->


<script>
  /* custom cursor */
  const cursor = document.getElementById('cursor');
  const links  = document.querySelectorAll('a');

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  links.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
</script>

</body>
</html>
