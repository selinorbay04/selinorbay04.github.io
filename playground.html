<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;

      /* per-category accent colours */
      --art-color:      #F97316;   /* orange */
      --sketch-color:   #8B3800;   /* burnt */
      --cad-color:      #344524;   /* dark green */
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      overflow:hidden;
      background:#EDE0CC;
      font-family: var(--font-body);
    }

    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position:fixed; top:0; left:0; right:0;
      z-index:300;
      height:var(--nav-h);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 clamp(24px,4vw,56px);
    }
    .logo {
      font-family:var(--font-display);
      font-size:28px; letter-spacing:2px;
      color:var(--black); text-decoration:none;
    }
    .nav-links { display:flex; gap:32px; align-items:center; }
    .nav-links a {
      font-family:var(--font-body);
      font-size:14px; font-weight:600; letter-spacing:0.6px;
      color:var(--black); text-decoration:none;
      transition:opacity .2s;
    }
    .nav-links a:hover { opacity:.45; }
    .nav-links a.active { text-decoration:underline; text-underline-offset:4px; }


    /* ══════════════════════════════════════
       STAGE
    ══════════════════════════════════════ */
    #stage {
      position:fixed; inset:0;
      width:100vw; height:100vh;
      overflow:hidden;
      cursor:none;
    }

    /* custom cursor */
    #cursor {
      position:fixed;
      width:14px; height:14px;
      border-radius:50%;
      background:var(--black);
      pointer-events:none;
      z-index:9999;
      transform:translate(-50%,-50%);
      transition:width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width:34px; height:34px; background:var(--orange); }


    /* ══════════════════════════════════════
       FLOATING ITEMS
    ══════════════════════════════════════ */
    .float-item {
      position:absolute;
      will-change:transform;
    }

    /* ── Keywords ── */
    .keyword {
      font-family:var(--font-graffiti);
      letter-spacing:6px;
      line-height:1;
      text-decoration:none;
      display:block;
      cursor:none;
      user-select:none;
      transition:letter-spacing .25s ease, filter .25s ease;
    }
    .keyword:hover { letter-spacing:10px; filter:brightness(1.12); }

    .keyword-art {
      font-size:clamp(88px,15vw,200px);
      color:var(--art-color);
      -webkit-text-stroke:3px var(--black);
      text-shadow: 5px 5px 0 var(--black), -2px -2px 0 var(--burnt), 8px 10px 14px rgba(0,0,0,.25);
      transform:rotate(-5deg);
    }
    .keyword-sketches {
      font-size:clamp(60px,9.5vw,128px);
      color:var(--cream);
      -webkit-text-stroke:3px var(--black);
      text-shadow: 4px 4px 0 var(--black), -3px -1px 0 var(--burnt), 7px 9px 12px rgba(0,0,0,.30);
      transform:rotate(3deg);
    }
    .keyword-cad {
      font-size:clamp(88px,14vw,190px);
      color:var(--green);
      -webkit-text-stroke:3px var(--black);
      text-shadow: 5px 5px 0 var(--black), -2px -3px 0 #1a2510, 6px 8px 12px rgba(0,0,0,.30);
      transform:rotate(-2deg);
    }

    /* ── Image cards ── */
    .float-img {
      position:absolute;
      display:block;
      border-radius:16px;
      overflow:hidden;
      cursor:none;
      text-decoration:none;
      transition:box-shadow .3s ease;
    }
    .float-img img {
      display:block;
      width:100%; height:100%;
      object-fit:cover;
      pointer-events:none;
    }

    /* coloured border per category */
    .cat-art     { border: 4px solid var(--art-color);    box-shadow:0 6px 28px rgba(249,115,22,.25), 0 2px 8px rgba(0,0,0,.12); }
    .cat-sketches{ border: 4px solid var(--sketch-color); box-shadow:0 6px 28px rgba(139,56,0,.22),   0 2px 8px rgba(0,0,0,.12); }
    .cat-cad     { border: 4px solid var(--cad-color);    box-shadow:0 6px 28px rgba(52,69,36,.28),   0 2px 8px rgba(0,0,0,.12); }

    .cat-art:hover     { box-shadow:0 14px 44px rgba(249,115,22,.40), 0 4px 12px rgba(0,0,0,.15); }
    .cat-sketches:hover{ box-shadow:0 14px 44px rgba(139,56,0,.36),   0 4px 12px rgba(0,0,0,.15); }
    .cat-cad:hover     { box-shadow:0 14px 44px rgba(52,69,36,.42),   0 4px 12px rgba(0,0,0,.15); }

  </style>
</head>

<script>
  const cursor = document.getElementById('cursor');
  const items  = document.querySelectorAll('.float-item');

  let mx=0, my=0, lx=0, ly=0;

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY  + 'px';
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  items.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });

  // Store base rotation per item
  const baseRot = {};
  items.forEach((el, i) => {
    const m = (el.getAttribute('style')||'').match(/rotate\(([^)]+)\)/);
    baseRot[i] = m ? m[1] : '0deg';
  });

  const MAX = 100;

  (function loop() {
    lx += (mx - lx) * 0.075;
    ly += (my - ly) * 0.075;
    items.forEach((el, i) => {
      const d = parseFloat(el.dataset.depth) || 0.3;
      el.style.transform = `translate(${lx*d*MAX}px,${ly*d*MAX}px) rotate(${baseRot[i]})`;
    });
    requestAnimationFrame(loop);
  })();
</script>
