<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #EDE0CC;
      font-family: var(--font-body);
    }

    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--black); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--black); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .45; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }

    /* ══════════════════════════════════════
       STAGE
    ══════════════════════════════════════ */
    #stage {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: none;
    }

    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--black);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width: 34px; height: 34px; background: var(--orange); }

    /* ══════════════════════════════════════
       ALL ITEMS  (vw-based sizing + positioning)

       LAYOUT GUARANTEE
       ─────────────────────────────────────
       Everything — positions AND sizes — is
       expressed in vw so all gaps scale together.

       Portrait card:  width 11.25vw, height 15vw (3:4)
       CAD card:       width 14vw,    height 10.5vw (4:3)

       Columns (left edges):
         ART  col-A  :  2vw
         ART  col-B  : 13vw       (Drawing_12 only)
         SKT  col-A  : 27vw
         SKT  col-B  : 41.5vw
         CAD  col    : 68vw

       Rows (top edges, portrait):
         Row-1 :  1.5vw          bottom = 16.5vw
         Row-2 : 19.5vw  gap 3vw bottom = 34.5vw
         Row-3 : 37.5vw  gap 3vw bottom = 52.5vw

       CAD rows (landscape):
         Row-1 :  1.5vw          bottom = 12vw
         Row-2 : 14.2vw  gap 2.2vw bottom = 24.7vw
         Row-3 : 26.9vw  gap 2.2vw bottom = 37.4vw

       Minimum image-to-image gap: 2.2vw ≥ 31.7px @ 1440px
       MAX parallax = 0.014 × innerWidth  →  max drift = 0.42vw @ any width
       0.42vw × 2 = 0.84vw  ≪  2.2vw gap  ✓  no overlap at any viewport
    ══════════════════════════════════════ */

    /* Keywords — background layer */
    .keyword {
      position: absolute;
      font-family: var(--font-graffiti);
      letter-spacing: 5px;
      line-height: 1;
      text-decoration: none;
      cursor: none;
      user-select: none;
      will-change: transform;
      z-index: 1;
      transition: letter-spacing .25s ease, filter .25s ease;
    }
    .keyword:hover { letter-spacing: 9px; filter: brightness(1.12); }

    .keyword-art {
      font-size: clamp(72px, 12vw, 172px);
      color: var(--orange);
      -webkit-text-stroke: 3px var(--black);
      text-shadow: 5px 5px 0 var(--black), -2px -2px 0 var(--burnt), 8px 10px 14px rgba(0,0,0,.25);
    }
    .keyword-sketches {
      font-size: clamp(44px, 7.2vw, 104px);
      color: var(--cream);
      -webkit-text-stroke: 2.5px var(--black);
      text-shadow: 4px 4px 0 var(--black), -3px -1px 0 var(--burnt), 7px 9px 12px rgba(0,0,0,.30);
    }
    .keyword-cad {
      font-size: clamp(72px, 12vw, 172px);
      color: var(--green);
      -webkit-text-stroke: 3px var(--black);
      text-shadow: 5px 5px 0 var(--black), -2px -3px 0 #1a2510, 6px 8px 12px rgba(0,0,0,.30);
    }

    /* Image cards — foreground layer */
    .float-img {
      position: absolute;
      display: block;
      border-radius: 14px;
      overflow: hidden;
      cursor: none;
      text-decoration: none;
      will-change: transform;
      z-index: 2;
      transition: box-shadow .3s ease;
    }
    .float-img img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: transform .45s ease;
    }
    .float-img:hover img { transform: scale(1.05); }

    /* portrait  3:4 — width + height both in vw so gap math holds */
    .img-p { width: 11.25vw; height: 15vw; }
    /* landscape 4:3 */
    .img-l { width: 14vw;    height: 10.5vw; }

    /* coloured borders */
    .cat-art {
      border: 3.5px solid var(--orange);
      box-shadow: 0 6px 28px rgba(249,115,22,.25), 0 2px 8px rgba(0,0,0,.12);
    }
    .cat-sketches {
      border: 3.5px solid var(--burnt);
      box-shadow: 0 6px 28px rgba(139,56,0,.22), 0 2px 8px rgba(0,0,0,.12);
    }
    .cat-cad {
      border: 3.5px solid var(--green);
      box-shadow: 0 6px 28px rgba(52,69,36,.28), 0 2px 8px rgba(0,0,0,.12);
    }
    .cat-art:hover     { box-shadow: 0 14px 44px rgba(249,115,22,.40), 0 4px 12px rgba(0,0,0,.15); }
    .cat-sketches:hover{ box-shadow: 0 14px 44px rgba(139,56,0,.36),   0 4px 12px rgba(0,0,0,.15); }
    .cat-cad:hover     { box-shadow: 0 14px 44px rgba(52,69,36,.42),   0 4px 12px rgba(0,0,0,.15); }

  </style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">

<!--
  STAGE LAYOUT  (all positions in vw — see CSS comment for proof)

  ART zone   x: 2–24.25vw     ← col-A 2vw, col-B 13vw
  SKETCH zone x: 27–52.75vw   ← col-A 27vw, col-B 41.5vw
  CAD zone   x: 68–82vw

  Row tops (portrait): 1.5vw / 19.5vw / 37.5vw
  Row tops (CAD land): 1.5vw / 14.2vw / 26.9vw
  Keywords: z-index 1 (behind images); may visually overlap images — intentional.
-->
<div id="stage">

  <!-- ══ ART keyword ══ -->
  <a class="keyword keyword-art"
     href="art.html"
     data-rot="-5deg" data-depth="0.06"
     style="left:3vw; top:35.5vw;">ART</a>

  <!-- ART col-A, rows 1 & 3 -->
  <a class="float-img img-p cat-art" href="art.html"
     data-rot="3deg" data-depth="0.25"
     style="left:2vw; top:1.5vw;">
    <img src="assests/playground/display/Drawing_03.jpg" alt="Drawing">
  </a>

  <a class="float-img img-p cat-art" href="art.html"
     data-rot="-4deg" data-depth="0.30"
     style="left:2vw; top:37.5vw;">
    <img src="assests/playground/display/Drawing_07.jpg" alt="Drawing">
  </a>

  <!-- ART col-B, row 2 -->
  <a class="float-img img-p cat-art" href="art.html"
     data-rot="-2deg" data-depth="0.18"
     style="left:13vw; top:19.5vw;">
    <img src="assests/playground/display/Drawing_12.jpg" alt="Drawing">
  </a>


  <!-- ══ SKETCHES keyword ══ -->
  <a class="keyword keyword-sketches"
     href="sketches.html"
     data-rot="3deg" data-depth="0.06"
     style="left:29vw; top:34vw;">SKETCHES</a>

  <!-- SKETCH col-A: rows 1, 2, 3 -->
  <a class="float-img img-p cat-sketches" href="sketches.html"
     data-rot="2.5deg" data-depth="0.22"
     style="left:27vw; top:1.5vw;">
    <img src="assests/playground/display/shoes_01.jpg" alt="Shoe sketch">
  </a>

  <a class="float-img img-p cat-sketches" href="sketches.html"
     data-rot="2deg" data-depth="0.28"
     style="left:27vw; top:19.5vw;">
    <img src="assests/playground/display/Sprint_page_05.jpg" alt="Sprint sketch">
  </a>

  <a class="float-img img-p cat-sketches" href="sketches.html"
     data-rot="3.5deg" data-depth="0.24"
     style="left:27vw; top:37.5vw;">
    <img src="assests/playground/display/Bus_stop_17.jpg" alt="Bus stop sketch">
  </a>

  <!-- SKETCH col-B: rows 1, 2, 3 -->
  <a class="float-img img-p cat-sketches" href="sketches.html"
     data-rot="-3deg" data-depth="0.15"
     style="left:41.5vw; top:1.5vw;">
    <img src="assests/playground/display/coffee_maker_01.jpg" alt="Coffee maker sketch">
  </a>

  <a class="float-img img-p cat-sketches" href="sketches.html"
     data-rot="-1.5deg" data-depth="0.20"
     style="left:41.5vw; top:19.5vw;">
    <img src="assests/playground/display/Bus_stop_02.jpg" alt="Bus stop sketch">
  </a>

  <a class="float-img img-p cat-sketches" href="sketches.html"
     data-rot="-2deg" data-depth="0.17"
     style="left:41.5vw; top:37.5vw;">
    <img src="assests/playground/display/coffee_maker_11.jpg" alt="Coffee maker sketch">
  </a>


  <!-- ══ CAD keyword ══ -->
  <a class="keyword keyword-cad"
     href="cad.html"
     data-rot="-2deg" data-depth="0.06"
     style="left:71vw; top:40vw;">CAD</a>

  <!-- CAD col, rows 1, 2, 3 -->
  <a class="float-img img-l cat-cad" href="cad.html"
     data-rot="-3deg" data-depth="0.20"
     style="left:68vw; top:1.5vw;">
    <img src="assests/playground/display/CAD_01.png" alt="CAD model">
  </a>

  <a class="float-img img-l cat-cad" href="cad.html"
     data-rot="2deg" data-depth="0.15"
     style="left:67.5vw; top:14.2vw;">
    <img src="assests/playground/display/CAD_02.png" alt="CAD model">
  </a>

  <a class="float-img img-l cat-cad" href="cad.html"
     data-rot="-1deg" data-depth="0.25"
     style="left:68.5vw; top:26.9vw;">
    <img src="assests/playground/display/CAD_03.png" alt="CAD model">
  </a>

</div><!-- /stage -->


<script>
  const cursor = document.getElementById('cursor');
  const items  = document.querySelectorAll('.keyword, .float-img');

  let mx = 0, my = 0, lx = 0, ly = 0;

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY  + 'px';
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  items.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });

  /*
   * MAX is proportional to viewport width (1.4vw) so parallax drift stays
   * a fixed fraction of vw-based gaps at every screen size.
   * max depth = 0.30  →  max drift = MAX × 0.30 = 0.42vw
   * minimum gap between any two images = 2.2vw  ≫  0.84vw (2 × 0.42)
   * Therefore: zero overlap guaranteed at all viewport widths.
   */
  function getMax() { return window.innerWidth * 0.014; }

  (function loop() {
    lx += (mx - lx) * 0.075;
    ly += (my - ly) * 0.075;
    const MAX = getMax();
    items.forEach(el => {
      const d   = parseFloat(el.dataset.depth) || 0.1;
      const rot = el.dataset.rot || '0deg';
      el.style.transform =
        `translate(${lx * d * MAX}px, ${ly * d * MAX}px) rotate(${rot})`;
    });
    requestAnimationFrame(loop);
  })();
</script>

</body>
