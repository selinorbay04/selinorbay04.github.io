<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Selin Orbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:   #FFF3DF;
      --orange:  #F97316;
      --burnt:   #8B3800;
      --green:   #344524;
      --bg:      #5C7040;
      --black:   #0f0f0f;
      --nav-h:   68px;
      --divider: rgba(245, 227, 200, 0.18);
      --font-display:  'Bebas Neue', sans-serif;
      --font-body:     'Inter', sans-serif;
      --font-graffiti: 'Bangers', cursive;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
    }


    /* ══════════════════════════════════════
       NAV
    ══════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 300;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 56px);
      border-bottom: 1px solid var(--divider);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 28px; letter-spacing: 2px;
      color: var(--cream); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--cream); text-decoration: none;
      transition: opacity .2s;
    }
    .nav-links a:hover { opacity: .5; }
    .nav-links a.active { text-decoration: underline; text-underline-offset: 4px; }


    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--cream);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      transition: width .22s ease, height .22s ease, background .22s ease;
    }
    #cursor.hover { width: 34px; height: 34px; background: var(--orange); }
    @media (hover: none) { #cursor { display: none; } }


    /* ══════════════════════════════════════
       3 × 3 PLAYGROUND GRID
       Labels sit on the true diagonal: (1,1) · (2,2) · (3,3)
       Column & row gaps bleed through as 1px dividers (--divider colour).
    ══════════════════════════════════════ */
    .pg-grid {
      position: fixed;
      top: var(--nav-h); left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows:    1fr 1fr 1fr;
      gap: 1px;
      background: var(--divider); /* shows through gap as full-height/width dividers */
      cursor: none;
    }


    /* ── Image cell ─────────────────────── */
    .pg-img {
      display: block;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      cursor: none;
    }

    .pg-img img {
      width: 100%; height: 100%;
      display: block;
      object-fit: contain;        /* full frame visible — no cropping */
      object-position: center;
      transition: transform .5s ease;
    }
    .pg-img:hover img { transform: scale(1.04); }

    /* hover darkening overlay */
    .pg-img::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.32);
      opacity: 0;
      z-index: 1;
      transition: opacity .4s ease;
      pointer-events: none;
    }
    .pg-img:hover::before { opacity: 1; }


    /* ── Label cell ─────────────────────── */
    .pg-label {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      text-decoration: none;
      cursor: none;
      /* inset box-shadow = visible border that doesn't interfere with gap lines */
      box-shadow: inset 0 0 0 1px var(--cream);
      transition: background .25s ease;
    }
    .pg-label:hover { background: rgba(0,0,0,0.08); }

    .pg-label-text {
      font-family: var(--font-display);
      font-size: clamp(28px, 3.6vw, 60px);
      letter-spacing: 5px;
      color: var(--cream);
      user-select: none;
      text-align: center;
    }


    /* ── Explicit grid positions ──────────
       Labels — mathematically on the diagonal
       (col 1, row 1), (col 2, row 2), (col 3, row 3)
    ─────────────────────────────────────── */
    .pg-label-art      { grid-column: 1; grid-row: 1; }
    .pg-label-sketches { grid-column: 2; grid-row: 2; }
    .pg-label-cad      { grid-column: 3; grid-row: 3; }

    /* Images — remaining 6 cells */
    .pg-img-r1c2 { grid-column: 2; grid-row: 1; }
    .pg-img-r1c3 { grid-column: 3; grid-row: 1; }
    .pg-img-r2c1 { grid-column: 1; grid-row: 2; }
    .pg-img-r2c3 { grid-column: 3; grid-row: 2; }
    .pg-img-r3c1 { grid-column: 1; grid-row: 3; }
    .pg-img-r3c2 { grid-column: 2; grid-row: 3; }


    /* ══════════════════════════════════════
       MOBILE — single column, labels only
    ══════════════════════════════════════ */
    @media (max-width: 767px) {
      html, body { overflow: hidden; }

      .pg-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        column-gap: 0;
      }

      /* hide all images */
      .pg-img { display: none; }

      /* reset column, keep row — labels stack vertically */
      .pg-label-art      { grid-column: 1; grid-row: 1; }
      .pg-label-sketches { grid-column: 1; grid-row: 2; }
      .pg-label-cad      { grid-column: 1; grid-row: 3; }

      .pg-label-text { font-size: clamp(56px, 15vw, 100px); }
    }

  </style>
</head>
<body>

<div id="cursor"></div>

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="index.html">SO</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="playground.html" class="active">Playground</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>


<!-- ════════════════════════════════════════
     3 × 3 PLAYGROUND GRID
     Row 1 (ART):      label at col 1 · images at col 2, col 3
     Row 2 (SKETCHES): image at col 1 · label at col 2 · image at col 3
     Row 3 (CAD):      images at col 1, col 2 · label at col 3
════════════════════════════════════════ -->
<div class="pg-grid">

  <!-- ── Row 1 — ART ── -->
  <a class="pg-label pg-label-art" href="art.html">
    <span class="pg-label-text">ART</span>
  </a>
  <a class="pg-img pg-img-r1c2" href="art.html">
    <img src="assests/playground/drawings/Drawing_13.jpg" alt="Drawing 13" loading="lazy">
  </a>
  <a class="pg-img pg-img-r1c3" href="art.html">
    <img src="assests/playground/drawings/Drawing_01.jpg" alt="Drawing 01" loading="lazy">
  </a>

  <!-- ── Row 2 — SKETCHES ── -->
  <a class="pg-img pg-img-r2c1" href="sketches.html">
    <img src="assests/playground/sketches/coffeemaker/coffee_maker_01.jpg" alt="Coffee maker sketch" loading="lazy">
  </a>
  <a class="pg-label pg-label-sketches" href="sketches.html">
    <span class="pg-label-text">SKETCHES</span>
  </a>
  <a class="pg-img pg-img-r2c3" href="sketches.html">
    <img src="assests/playground/sketches/shoes/shoes_01.jpg" alt="Shoe sketch" loading="lazy">
  </a>

  <!-- ── Row 3 — CAD ── -->
  <a class="pg-img pg-img-r3c1" href="cad.html">
    <img src="assests/playground/images_to_display/CT_.png" alt="CT scanner CAD model" loading="lazy">
  </a>
  <a class="pg-img pg-img-r3c2" href="cad.html">
    <img src="assests/playground/images_to_display/Dode_.png" alt="Dodecahedron CAD model" loading="lazy">
  </a>
  <a class="pg-label pg-label-cad" href="cad.html">
    <span class="pg-label-text">CAD</span>
  </a>

</div><!-- /pg-grid -->


<script>
  /* custom cursor */
  const cursor = document.getElementById('cursor');
  const links  = document.querySelectorAll('a');

  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  links.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
</script>

</body>
</html>
